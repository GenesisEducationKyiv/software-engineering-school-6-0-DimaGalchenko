syntax = "proto3";

package notification.v1;

import "google/protobuf/struct.proto";

service NotificationService {
  rpc Send(SendRequest) returns (SendResponse);
}

message SendRequest {
  string template_id = 1;
  string email = 2;
  // Schemaless template variables (confirmToken, repo, tagName, ...) so a new
  // template variable needs no proto change on both services.
  google.protobuf.Struct data = 3;
}

message SendResponse {
  bool success = 1;
  string message = 2;
}
